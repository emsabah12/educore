      summary: List the current tenant's effective Subscription feature codes
      description: |
        Read-only projection (union of plan baseline + active add-ons —
        never locked_readonly/locked_hidden add-ons). Any authenticated
        tenant member may call this; it is NOT a management endpoint
        (that stays superadmin-only). Powers frontend navigation
        visibility for feature-gated modules such as hr_module, so a
        menu entry is only shown when it would not immediately 403
        from CheckTenantFeature.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: The tenant's currently effective feature codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantEffectiveFeaturesSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationContextDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/organizations:
