            membership does not have hr.employment-types.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employments/{employmentId}/compensation-assignments:
    get:
      operationId: hrCompensationAssignmentIndex
      x-laravel-route-name: api.v1.hr.employments.compensation-assignments.index
      tags:
        - Human Resources
      summary: List the Compensation Assignment history for an Employment
      description: |
        HR-006 §7.3 — tenant-wide (deliberately not workspace-scoped
        or audit-trailed for this first release — see controller
        docblock). Returns every status (DRAFT, APPROVED, ENDED,
        CANCELLED, SUPERSEDED), newest effective_from first.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: Compensation Assignment history for the Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.compensation.assignments.view
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrCompensationAssignmentStore
      x-laravel-route-name: api.v1.hr.employments.compensation-assignments.store
      tags:
        - Human Resources
      summary: Create a new DRAFT Compensation Assignment for an Employment
      description: |
        HR-006 §7.3 — starts the maker-checker lifecycle at DRAFT;
        a separate /approve call (hr.compensation.assignments.approve)
        is required to activate it. FormRequest validates raw types
        only -- business rules (value_mode vs amount/rate, Employment
        must be ACTIVE, etc.) are enforced by the service and surface
        as 409 COMPENSATION_ASSIGNMENT_CONFLICT.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - compensation_component_id
                - currency_code
                - effective_from
              properties:
                compensation_component_id:
                  $ref: "#/components/schemas/UuidV7"
                employment_position_assignment_id:
                  oneOf:
                    - $ref: "#/components/schemas/UuidV7"
                    - type: "null"
                amount:
                  type:
                    - number
                    - "null"
                  exclusiveMinimum: 0
                rate:
                  type:
                    - number
                    - "null"
                  exclusiveMinimum: 0
                currency_code:
                  type: string
                  pattern: "^[A-Z]{3}$"
                effective_from:
                  type: string
                  format: date
                effective_to:
                  type:
                    - string
                    - "null"
                  format: date
                reason:
                  type:
                    - string
                    - "null"
      responses:
        "201":
          description: DRAFT Compensation Assignment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentCreatedSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.compensation.assignments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: |
            Employment, or the referenced CompensationComponent/
            EmploymentPositionAssignment, was not found in the current
            tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentNotFoundError"

        "409":
          description: Business-rule conflict (e.g. value_mode vs amount/rate mismatch).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employments/{employmentId}/compensation-assignments/{assignmentId}/approve:
