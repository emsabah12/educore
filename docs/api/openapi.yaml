        - approved_at
        - idempotency_key
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        employment_id:
          $ref: "#/components/schemas/UuidV7"
        compensation_component_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        adjustment_type:
          type: string
          enum:
            - ONE_TIME_EARNING
            - COMPENSATION_CORRECTION
        amount:
          description: Decimal string (4 dp).
          type: string
        currency_code:
          type: string
        target_period_start:
          type: string
          format: date
        target_period_end:
          type: string
          format: date
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - APPROVED
            - REJECTED
            - CANCELLED
        reason:
          type: string
        requested_by_membership_id:
          $ref: "#/components/schemas/UuidV7"
        approved_by_membership_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        approved_at:
