      tags:
        - Human Resources
      summary: Show one Employee visible in the current organizational workspace
      description: |
        Filters from the exact same visibility query as
        GET /hr/workspace/employees (HR-013 §6 Target Employee Scope
        Rule) — an Employee outside the current workspace returns 404,
        identical to an Employee that does not exist at all, so
        existence is never leaked across workspace boundaries.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
