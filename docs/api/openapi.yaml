      operationId: hrCompensationAssignmentApprove
      x-laravel-route-name: api.v1.hr.employments.compensation-assignments.approve
      tags:
        - Human Resources
      summary: Approve a DRAFT Compensation Assignment
      description: |
        HR-006 §7.3 — DRAFT -> APPROVED. Uses a separate, higher-impact
        permission (hr.compensation.assignments.approve) from
        create/end (hr.compensation.assignments.manage) -- same
        pattern as hr.recruitment.approve.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
        - name: assignmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: Compensation Assignment approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentActionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.compensation.assignments.approve
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Compensation Assignment was not found under this Employment in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentNotFoundError"

        "409":
          description: Assignment is not currently DRAFT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentConflictError"

        "500":
          $ref: "#/components/responses/InternalServerError"

