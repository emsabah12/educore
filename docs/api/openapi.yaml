openapi: 3.1.0

info:
  title: EduCore Foundation API
  version: 1.0.0-foundation
  description: |
    Canonical HTTP contract for the EduCore foundation surface.

    This specification currently documents the stable Core, Auth, User, and
    first-party Browser BFF foundation APIs.

    Academic and HR APIs remain public Laravel routes but are explicitly
    recorded under x-educore-deferred-routes until their domain API boundary,
    validation, and canonical error contracts are hardened.

servers:
  - url: /

tags:
  - name: Authentication
  - name: Browser Session
  - name: Authorization
  - name: Core Platform
  - name: Tenancy
  - name: User Context
  - name: Human Resources

paths:
  /api/v1/auth/login-token:
    post:
      operationId: authLoginToken
      x-laravel-route-name: api.v1.auth.login-token
      tags:
        - Authentication
      summary: Authenticate a global User identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginTokenSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      x-laravel-route-name: api.v1.auth.logout
      tags:
        - Authentication
      summary: Revoke the current bearer token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/auth/me:
    get:
      operationId: authBootstrapContext
      x-laravel-route-name: api.v1.auth.me
      tags:
        - Authentication
      summary: Return the authenticated frontend bootstrap context
      description: |
        Supports canonical Bearer clients and first-party Browser Session
        clients. BrowserSessionAuth requires X-EduCore-Membership-Id to select
        one server-held Membership credential. The header is a locator only
        and is not required for BearerAuth.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Authenticated frontend bootstrap context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedBootstrapSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/auth/identity:
    get:
      operationId: authIdentity
      x-laravel-route-name: api.v1.auth.identity
      tags:
        - Authentication
      summary: Return the canonical global authenticated identity
      description: |
        Supports BearerAuth and BrowserSessionAuth at User identity scope.
        This operation intentionally never establishes or exposes
        Membership, Tenant, Workspace, Role, or Permission context —
        X-EduCore-Membership-Id is not accepted here.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      responses:
        "200":
          description: Global authenticated identity projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalIdentitySuccess"

        "401":
          description: |
            Authentication is required for the selected Bearer or Browser
            Session transport.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationRequiredError"
                  - $ref: "#/components/schemas/BrowserSessionAuthenticationRequiredError"

  /api/v1/browser/session/csrf:
    get:
      operationId: browserSessionCsrfBootstrap
      x-laravel-route-name: api.v1.browser.session.csrf
      tags:
        - Browser Session
      summary: Bootstrap the browser session and request-forgery cookie pair
      description: |
        Starts or resumes the server-side Laravel browser session and emits
        the anti-forgery cookie pair used by the first-party same-origin SPA.

        The response intentionally contains no authentication material.
      security: []
      responses:
        "204":
          description: Browser session / request-forgery bootstrap completed with no response body.

  /api/v1/browser/auth/login:
    post:
      operationId: browserAuthLogin
      x-laravel-route-name: api.v1.browser.auth.login
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Authenticate a global User into a server-side Browser Session
      description: |
        Authenticates the global User identity, regenerates the
        pre-authentication session identifier, and establishes identity-only
        Browser Session state.

        Fresh Browser login does not select a Membership or Tenant, does not
        issue a browser-visible bearer credential, and never includes
        access_token in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Global Browser identity authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLoginSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/browser/auth/logout:
    post:
      operationId: browserAuthLogout
      x-laravel-route-name: api.v1.browser.auth.logout
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Revoke Browser Session credentials and invalidate the shared session
      description: |
        Best-effort revokes every canonical bearer credential currently held
        by the shared Browser Session Broker, clears credential custody,
        invalidates the session identifier, and rotates the CSRF token.

        Logout is intentionally idempotent for an anonymous browser session.
      security:
        - BrowserSessionAuth: []
        - {}
      responses:
        "200":
          description: Browser logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLogoutSuccess"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/core/authorization/capabilities:
    get:
      operationId: authorizationTenantCapabilities
      x-laravel-route-name: api.v1.core.authorization.capabilities.index
      tags:
        - Authorization
      summary: Project effective tenant capabilities
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require the header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Effective tenant capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/workspace-capabilities:
    get:
      operationId: authorizationWorkspaceCapabilities
      x-laravel-route-name: api.v1.core.authorization.workspace-capabilities.index
      tags:
        - Authorization
      summary: Project effective capabilities for the selected organizational workspace
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select the canonical Membership
        context. X-EduCore-Organizational-Assignment-Id remains required for
        both transports and is a locator only.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
      responses:
        "200":
          description: Effective workspace capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Tenant authentication, Browser Session Membership, or
            organizational context is missing, unavailable, mismatched, or
            denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/OrganizationalContextDeniedError"

        "422":
          description: |
            Browser Membership or organizational assignment locator validation
            failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidBrowserMembershipIdError"
                  - $ref: "#/components/schemas/InvalidOrganizationalAssignmentIdError"

        "500":
          description: |
            Organizational context resolution or capability projection
            failed unexpectedly.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrganizationalContextResolutionFailedError"
                  - $ref: "#/components/schemas/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/roles:
    get:
      operationId: authorizationRoleCatalog
      x-laravel-route-name: api.v1.core.authorization.roles.index
      tags:
        - Authorization
      summary: Return the safe global role catalog for tenant administrators
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Safe role catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogSuccess"

        "403":
          description: |
            Tenant authentication context is invalid or the current Membership
            does not have the required tenant administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/health:
    get:
      operationId: coreHealth
      x-laravel-route-name: api.core.health
      tags:
        - Core Platform
      summary: Return platform health status
      security: []
      responses:
        "200":
          description: Platform is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

        "503":
          description: |
            At least one monitored platform component is unhealthy.

            The response intentionally uses the HealthStatus representation
            rather than the canonical business ApiError envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/core/notifications/dispatch:
    post:
      operationId: notificationDispatch
      x-laravel-route-name: api.v1.core.notifications.dispatch
      tags:
        - Core Platform
      summary: Queue a tenant-scoped notification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchRequest"
      responses:
        "202":
          description: Notification accepted for asynchronous delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchSuccess"

        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/NotificationDispatchFailed"

  /api/v1/core/tenants:
    get:
      operationId: tenantIndex
      x-laravel-route-name: api.v1.core.tenants.index
      tags:
        - Tenancy
      summary: List tenants as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantPerPage"
      responses:
        "200":
          description: Paginated tenant collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: tenantStore
      x-laravel-route-name: api.v1.core.tenants.store
      tags:
        - Tenancy
      summary: Provision a tenant as a global superadmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTenantRequest"
      responses:
        "201":
          description: Tenant and initial tenant administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCreatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenants/{id}:
    put:
      operationId: tenantUpdate
      x-laravel-route-name: api.v1.core.tenants.update
      tags:
        - Tenancy
      summary: Update a tenant as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUpdatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employees:
    get:
      operationId: hrEmployeeIndex
      x-laravel-route-name: api.v1.hr.employees.index
      tags:
        - Human Resources
      summary: List Employees for the current tenant
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeePerPage"
      responses:
        "200":
          description: Paginated Employee collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListSuccess"

        "403":
          description: |
            Tenant authentication context is invalid, or the current
            Membership does not have hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrEmployeeStore
      x-laravel-route-name: api.v1.hr.employees.store
      tags:
        - Human Resources
      summary: Provision an Employee profile within the current tenant
      description: |
        Atomically creates a Person, Membership, and Employee profile.
        This administrative provisioning path does not create a User
        account for the Employee.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEmployeeRequest"
      responses:
        "201":
          description: Employee profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeCreatedSuccess"

        "403":
          description: |
            Tenant authentication context is invalid, or the current
            Membership does not have hr.employees.create permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/EmployeeProvisioningFailed"

  /api/v1/hr/workspace/employees:
    get:
      operationId: hrWorkspaceEmployeeIndex
      x-laravel-route-name: api.v1.hr.workspace.employees.index
      tags:
        - Human Resources
      summary: List Employees visible in the current organizational workspace
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require that header.
        Both transports require X-EduCore-Organizational-Assignment-Id to
        select the organizational workspace (HR-013 §6 Target Employee
        Scope Rule) — an Employee is only visible here when their current
        Employment Placement resolves to the same Organization (and, when
        the workspace is unit-scoped, the same Organization Unit).
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - $ref: "#/components/parameters/EmployeePage"
        - $ref: "#/components/parameters/EmployeePerPage"
      responses:
        "200":
          description: Paginated Employee collection scoped to the current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEmployeeListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, or mismatched; organizational context is missing or
            invalid; or the current organizational assignment does not have
            hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employees/{employeeId}:
    get:
      operationId: hrWorkspaceEmployeeShow
      x-laravel-route-name: api.v1.hr.workspace.employees.show
      tags:
        - Human Resources
      summary: Show one Employee visible in the current organizational workspace
      description: |
        Filters from the exact same visibility query as
        GET /hr/workspace/employees (HR-013 §6 Target Employee Scope
        Rule) — an Employee outside the current workspace returns 404,
        identical to an Employee that does not exist at all, so
        existence is never leaked across workspace boundaries.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employeeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The Employee's detail, including Employment history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEmployeeDetailSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; or the current organizational
            assignment does not have hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employment-types:
    get:
      operationId: hrEmploymentTypeIndex
      x-laravel-route-name: api.v1.hr.employment-types.index
      tags:
        - Human Resources
      summary: List the current tenant's Employment Type catalog
      description: |
        HR-002 §3 (OD-HR-DATA-002) — Employment Type is a tenant-scoped
        catalog (e.g. TETAP / KONTRAK / HONORER), never a global enum.
        Read-only; powers pickers such as the Tambah Employment form.
        Deliberately tenant-wide, not organizational-scoped — supports
        BearerAuth and BrowserSessionAuth but requires no organizational
        context header. Returns both active and inactive entries; the
        presentation layer decides which to offer for selection.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: The tenant's Employment Type catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTypeListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.employments.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employees/{employeeId}/employments:
    post:
      operationId: hrWorkspaceEmploymentStore
      x-laravel-route-name: api.v1.hr.workspace.employees.employments.store
      tags:
        - Human Resources
      summary: Create a new PLANNED Employment episode for an Employee
      description: |
        HR-002 §9 — starts a new Employment episode with PLANNED status.
        Filters the target Employee through the same visibility rule as
        GET /hr/workspace/employees (HR-013 §6) — an Employee outside
        the current workspace returns 403
        EMPLOYEE_OUT_OF_ORGANIZATIONAL_SCOPE.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employeeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEmploymentRequest"
      responses:
        "201":
          description: The newly created, PLANNED Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; the current organizational
            assignment does not have hr.employments.manage permission;
            or the Employee is outside the current organizational
            workspace.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"
                  - $ref: "#/components/schemas/EmployeeOutOfOrganizationalScopeError"

        "404":
          description: Employee was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNotFoundError"

        "409":
          description: |
            The referenced EmploymentType or EmploymentClassification
            catalog entry is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employments/{employmentId}/activate:
    post:
      operationId: hrWorkspaceEmploymentActivate
      x-laravel-route-name: api.v1.hr.workspace.employments.activate
      tags:
        - Human Resources
      summary: Activate a PLANNED Employment episode
      description: |
        Transitions Employment status PLANNED -> ACTIVE (HR-002 §9).
        Rejected with 409 EMPLOYMENT_LIFECYCLE_CONFLICT if the
        Employment is not currently PLANNED, or if the owning Employee
        already has a different ACTIVE Employment (INV-HR-002: at most
        one ACTIVE Employment per Employee).
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The activated Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; the current organizational
            assignment does not have hr.employments.manage permission;
            or the Employment's owning Employee is outside the current
            organizational workspace.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"
                  - $ref: "#/components/schemas/EmployeeOutOfOrganizationalScopeError"

        "404":
          description: Employment was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentNotFoundError"

        "409":
          description: The Employment is not currently PLANNED, or another Employment is already ACTIVE for this Employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employments/{employmentId}/cancel:
    post:
      operationId: hrWorkspaceEmploymentCancel
      x-laravel-route-name: api.v1.hr.workspace.employments.cancel
      tags:
        - Human Resources
      summary: Cancel a PLANNED Employment episode
      description: |
        Transitions Employment status PLANNED -> CANCELLED (HR-002 §9).
        Rejected with 409 EMPLOYMENT_LIFECYCLE_CONFLICT if the
        Employment is not currently PLANNED.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The cancelled Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; the current organizational
            assignment does not have hr.employments.manage permission;
            or the Employment's owning Employee is outside the current
            organizational workspace.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"
                  - $ref: "#/components/schemas/EmployeeOutOfOrganizationalScopeError"

        "404":
          description: Employment was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentNotFoundError"

        "409":
          description: The Employment is not currently PLANNED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employments/{employmentId}/end:
    post:
      operationId: hrWorkspaceEmploymentEnd
      x-laravel-route-name: api.v1.hr.workspace.employments.end
      tags:
        - Human Resources
      summary: End an ACTIVE Employment episode
      description: |
        Transitions Employment status ACTIVE -> ENDED (HR-002 §9.4) and
        closes the Employment's open Placement and Position Assignment.
        Guarded by its own hr.employments.end permission — sengaja
        terpisah dari hr.employments.manage karena higher-impact
        dibanding create/activate/cancel. Rejected with 409
        EMPLOYMENT_LIFECYCLE_CONFLICT if the Employment is not
        currently ACTIVE.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndEmploymentRequest"
      responses:
        "200":
          description: The ended Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; the current organizational
            assignment does not have hr.employments.end permission; or
            the Employment's owning Employee is outside the current
            organizational workspace.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"
                  - $ref: "#/components/schemas/EmployeeOutOfOrganizationalScopeError"

        "404":
          description: Employment was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentNotFoundError"

        "409":
          description: The Employment is not currently ACTIVE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenant-roles:
    get:
      operationId: tenantRoleIndex
      x-laravel-route-name: api.v1.core.tenant-roles.index
      tags:
        - Core
      summary: List custom Roles owned by the current tenant
      description: |
        Supports BearerAuth and BrowserSessionAuth. Only returns Roles
        where tenant_id matches the caller's tenant — never global Roles
        and never another tenant's custom Roles. Returns ALL of the
        tenant's custom Roles regardless of visibility_state (including
        locked_hidden) — the presentation layer decides how to display
        each state, the backend never silently drops data.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: The tenant's custom Role catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCustomRoleListSuccess"

        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequiredError"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; or the current
            membership does not have tenant.custom-roles.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: tenantRoleStore
      x-laravel-route-name: api.v1.core.tenant-roles.store
      tags:
        - Core
      summary: Create a custom Role for the current tenant
      description: |
        Requires the tenant's custom_roles Subscription feature to be
        currently effective (via plan or an active/trial add-on) —
        rejected with 403 CUSTOM_ROLE_FEATURE_NOT_AVAILABLE otherwise.
        name is unique per tenant, not globally.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTenantRoleRequest"
      responses:
        "201":
          description: The newly created custom Role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCustomRoleDetailSuccess"

        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequiredError"

        "403":
          description: |
            Authentication or Browser Session Membership context denied,
            authorization denied, or the custom_roles feature is not
            currently effective for this tenant.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"
                  - $ref: "#/components/schemas/CustomRoleFeatureNotAvailableError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenant-roles/assignable-permissions:
    get:
      operationId: tenantRoleAssignablePermissions
      x-laravel-route-name: api.v1.core.tenant-roles.assignable-permissions
      tags:
        - Core
      summary: List permissions the tenant may assign to a custom Role
      description: |
        MVP scope: the full global permission catalog, not filtered by
        the tenant's module entitlements. This scope decision lives in
        exactly one place server-side (TenantRoleService::assignablePermissions())
        and may narrow later without changing this contract's shape.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: The assignable permission catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCustomRoleAssignablePermissionListSuccess"

        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequiredError"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; or the current
            membership does not have tenant.custom-roles.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenant-roles/{roleId}:
