                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrCompensationAdjustmentStore
      x-laravel-route-name: api.v1.hr.employments.compensation-adjustments.store
      tags:
        - Human Resources
      summary: Create a new DRAFT Compensation Adjustment request
      description: |
        HR-006 §7.8 — starts the maker-checker lifecycle at DRAFT; a
        separate /submit call is required before it can be
        approved/rejected. `idempotency_key` is client-supplied and
        must be unique per Employment, guarding against duplicate
        submission on retry.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - adjustment_type
                - amount
                - currency_code
                - target_period_start
                - target_period_end
                - reason
                - idempotency_key
              properties:
                compensation_component_id:
                  oneOf:
                    - $ref: "#/components/schemas/UuidV7"
                    - type: "null"
                adjustment_type:
                  type: string
                  enum:
                    - ONE_TIME_EARNING
                    - COMPENSATION_CORRECTION
                amount:
                  type: number
                  exclusiveMinimum: 0
                currency_code:
                  type: string
                  pattern: "^[A-Z]{3}$"
                target_period_start:
                  type: string
                  format: date
                target_period_end:
                  type: string
                  format: date
                reason:
                  type: string
                idempotency_key:
                  type: string
                  maxLength: 120
      responses:
        "201":
          description: DRAFT Compensation Adjustment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAdjustmentCreatedSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.compensation.adjustments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Employment or the referenced CompensationComponent was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAdjustmentNotFoundError"

        "409":
          description: Business-rule conflict (e.g. duplicate idempotency_key).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAdjustmentConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

