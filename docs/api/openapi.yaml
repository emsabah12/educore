            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.employments.manage permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Employment was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentNotFoundError"

        "409":
          description: The Employment is not currently PLANNED, or another Employment is already ACTIVE for this Employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "500":
          $ref: "#/components/responses/InternalServerError"

