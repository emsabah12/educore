openapi: 3.1.0

info:
  title: EduCore Foundation API
  version: 1.0.0-foundation
  description: |
    Canonical HTTP contract for the EduCore foundation surface.

    This specification currently documents the stable Core, Auth, User, and
    first-party Browser BFF foundation APIs.

    Academic and HR APIs remain public Laravel routes but are explicitly
    recorded under x-educore-deferred-routes until their domain API boundary,
    validation, and canonical error contracts are hardened.

servers:
  - url: /

tags:
  - name: Authentication
  - name: Browser Session
  - name: Authorization
  - name: Core Platform
  - name: Tenancy
  - name: User Context

paths:
  /api/v1/auth/login-token:
    post:
      operationId: authLoginToken
      x-laravel-route-name: api.v1.auth.login-token
      tags:
        - Authentication
      summary: Authenticate into a tenant membership context
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginTokenSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      x-laravel-route-name: api.v1.auth.logout
      tags:
        - Authentication
      summary: Revoke the current bearer token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/auth/me:
    get:
      operationId: authBootstrapContext
      x-laravel-route-name: api.v1.auth.me
      tags:
        - Authentication
      summary: Return the authenticated frontend bootstrap context
      description: |
        Supports canonical Bearer clients and first-party Browser Session
        clients. BrowserSessionAuth requires X-EduCore-Membership-Id to select
        one server-held Membership credential. The header is a locator only
        and is not required for BearerAuth.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Authenticated frontend bootstrap context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedBootstrapSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/browser/session/csrf:
    get:
      operationId: browserSessionCsrfBootstrap
      x-laravel-route-name: api.v1.browser.session.csrf
      tags:
        - Browser Session
      summary: Bootstrap the browser session and request-forgery cookie pair
      description: |
        Starts or resumes the server-side Laravel browser session and emits
        the anti-forgery cookie pair used by the first-party same-origin SPA.

        The response intentionally contains no authentication material.
      security: []
      responses:
        "204":
          description: Browser session / request-forgery bootstrap completed with no response body.

  /api/v1/browser/auth/login:
    post:
      operationId: browserAuthLogin
      x-laravel-route-name: api.v1.browser.auth.login
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Authenticate into a server-side Browser Session
      description: |
        Authenticates with the canonical credential issuer, regenerates the
        pre-authentication session identifier, and stores the issued bearer
        credential exclusively in server-side Browser Session custody.

        The browser response never includes access_token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Browser authentication succeeded and credential custody remains server-side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLoginSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/browser/auth/logout:
    post:
      operationId: browserAuthLogout
      x-laravel-route-name: api.v1.browser.auth.logout
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Revoke Browser Session credentials and invalidate the shared session
      description: |
        Best-effort revokes every canonical bearer credential currently held
        by the shared Browser Session Broker, clears credential custody,
        invalidates the session identifier, and rotates the CSRF token.

        Logout is intentionally idempotent for an anonymous browser session.
      security:
        - BrowserSessionAuth: []
        - {}
      responses:
        "200":
          description: Browser logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLogoutSuccess"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/core/authorization/capabilities:
    get:
      operationId: authorizationTenantCapabilities
      x-laravel-route-name: api.v1.core.authorization.capabilities.index
      tags:
        - Authorization
      summary: Project effective tenant capabilities
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require the header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Effective tenant capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/workspace-capabilities:
    get:
      operationId: authorizationWorkspaceCapabilities
      x-laravel-route-name: api.v1.core.authorization.workspace-capabilities.index
      tags:
        - Authorization
      summary: Project effective capabilities for the selected organizational workspace
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select the canonical Membership
        context. X-EduCore-Organizational-Assignment-Id remains required for
        both transports and is a locator only.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
      responses:
        "200":
          description: Effective workspace capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Tenant authentication, Browser Session Membership, or
            organizational context is missing, unavailable, mismatched, or
            denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/OrganizationalContextDeniedError"

        "422":
          description: |
            Browser Membership or organizational assignment locator validation
            failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidBrowserMembershipIdError"
                  - $ref: "#/components/schemas/InvalidOrganizationalAssignmentIdError"

        "500":
          description: |
            Organizational context resolution or capability projection
            failed unexpectedly.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrganizationalContextResolutionFailedError"
                  - $ref: "#/components/schemas/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/roles:
    get:
      operationId: authorizationRoleCatalog
      x-laravel-route-name: api.v1.core.authorization.roles.index
      tags:
        - Authorization
      summary: Return the safe global role catalog for tenant administrators
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Safe role catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogSuccess"

        "403":
          description: |
            Tenant authentication context is invalid or the current Membership
            does not have the required tenant administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/health:
    get:
      operationId: coreHealth
      x-laravel-route-name: api.core.health
      tags:
        - Core Platform
      summary: Return platform health status
      security: []
      responses:
        "200":
          description: Platform is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

        "503":
          description: |
            At least one monitored platform component is unhealthy.

            The response intentionally uses the HealthStatus representation
            rather than the canonical business ApiError envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/core/notifications/dispatch:
    post:
      operationId: notificationDispatch
      x-laravel-route-name: api.v1.core.notifications.dispatch
      tags:
        - Core Platform
      summary: Queue a tenant-scoped notification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchRequest"
      responses:
        "202":
          description: Notification accepted for asynchronous delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchSuccess"

        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/NotificationDispatchFailed"

  /api/v1/core/tenants:
    get:
      operationId: tenantIndex
      x-laravel-route-name: api.v1.core.tenants.index
      tags:
        - Tenancy
      summary: List tenants as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantPerPage"
      responses:
        "200":
          description: Paginated tenant collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: tenantStore
      x-laravel-route-name: api.v1.core.tenants.store
      tags:
        - Tenancy
      summary: Provision a tenant as a global superadmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTenantRequest"
      responses:
        "201":
          description: Tenant and initial tenant administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCreatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenants/{id}:
    put:
      operationId: tenantUpdate
      x-laravel-route-name: api.v1.core.tenants.update
      tags:
        - Tenancy
      summary: Update a tenant as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUpdatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/my-memberships:
    get:
      operationId: userMembershipIndex
      x-laravel-route-name: api.v1.user.memberships.index
      tags:
        - User Context
      summary: List active memberships owned by the authenticated Person
      description: |
        Supports BearerAuth and BrowserSessionAuth at User identity scope.
        X-EduCore-Membership-Id is intentionally not required because this
        operation discovers the Memberships available to the authenticated
        Person.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      responses:
        "200":
          description: Person-owned active membership projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListSuccess"

        "401":
          description: |
            Authentication is required for the selected Bearer or Browser
            Session transport.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationRequiredError"
                  - $ref: "#/components/schemas/BrowserSessionAuthenticationRequiredError"

        "403":
          description: |
            Browser Session identity context does not match the canonical
            authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/memberships/{membership_id}/switch:
    post:
      operationId: userMembershipSwitch
      x-laravel-route-name: api.v1.user.memberships.switch
      tags:
        - User Context
      summary: Exchange the current token for another owned membership context
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: |
            New bearer token issued for the selected Membership and Tenant.
            The previously issued token is not implicitly revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipSwitchSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/MembershipSwitchDenied"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/browser/user/memberships/{membership_id}/switch:
    post:
      operationId: browserUserMembershipSwitch
      x-laravel-route-name: api.v1.browser.user.memberships.switch
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
        - User Context
      summary: Prepare another canonical Membership credential inside Browser Session custody
      description: |
        Uses Browser Session identity and the canonical Membership switch action
        to validate ownership and Tenant availability. The newly issued bearer
        is stored server-side and the previously prepared Membership credential
        remains available for independent browser tabs.

        The browser response never includes access_token and no global active
        Membership is written into the shared session.
      security:
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/BrowserMembershipPathId"
      responses:
        "200":
          description: Target Membership credential prepared in server-side Browser Session custody.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserMembershipSwitchSuccess"
        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"
        "403":
          $ref: "#/components/responses/MembershipSwitchDenied"
        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/my-workspaces:
    get:
      operationId: userWorkspaceIndex
      x-laravel-route-name: api.v1.user.workspaces.index
      tags:
        - User Context
      summary: Discover active organizational workspaces for the current membership
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require the header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Available frontend workspace projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiscoverySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/memberships/{target_membership_id}/assign-role:
    post:
      operationId: userMembershipRoleAssign
      x-laravel-route-name: api.v1.user.rbac.assign
      tags:
        - User Context
        - Authorization
      summary: Assign a global role to a membership as a tenant administrator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TargetMembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRoleAssignmentRequest"
      responses:
        "200":
          description: Membership role assignment completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRoleAssignmentSuccess"

        "403":
          description: |
            Tenant authentication context is invalid or the authenticated
            Membership does not have the required administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/MembershipRoleAssignmentRejected"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        EduCore encrypted opaque bearer token.

        The token establishes authenticated User, Membership, and Tenant
        context. Roles, permissions, capabilities, organizational
        assignments, and workspace authority are intentionally not encoded
        as trusted authorization claims.

    BrowserSessionAuth:
      type: apiKey
      in: cookie
      name: __Host-educore-session
      description: |
        First-party same-origin Browser Session credential. Production uses a
        host-only Secure HttpOnly SameSite=Strict __Host- session cookie.

        Canonical bearer credentials remain exclusively in server-side
        Browser Session custody and are never exposed to JavaScript.

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID accepted without a version-specific HTTP constraint.

    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: RFC 9562 UUID version 7 identifier.

    MembershipPathIdentifier:
      type: string
      minLength: 1
      description: |
        Membership route identifier.

        The current HTTP/application path does not perform explicit UUIDv7
        validation before repository lookup. This schema intentionally does
        not claim a version-specific validation contract.

    PermissionName:
      type: string
      minLength: 1
      description: Canonical machine-readable permission name.

    LoginTokenRequest:
      type: object
      required:
        - email
        - password
        - tenant_uuid
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: |
            Email is trimmed and lowercased before credential lookup.
        password:
          type: string
          minLength: 6
        tenant_uuid:
          $ref: "#/components/schemas/Uuid"
      description: |
        Login request for a specific Tenant.

        tenant_uuid currently uses generic UUID validation rather than
        UUIDv7-only validation.

    AuthenticationTokenContext:
      type: object
      required:
        - user_id
        - name
        - email
        - membership_id
        - tenant_id
      properties:
        user_id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        email:
          type: string
          format: email
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"

    AuthenticationTokenData:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - context
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        context:
          $ref: "#/components/schemas/AuthenticationTokenContext"

    LoginTokenSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/AuthenticationTokenData"

    LogoutSuccess:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.
        data:
          type: object
          required:
            - token_revoked
          properties:
            token_revoked:
              type: boolean
              const: true

    BrowserLoginData:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - tenant_id
      properties:
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"

    BrowserLoginSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserLoginData"

    BrowserLogoutSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.

    BrowserMembershipSwitchData:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - tenant_id
        - tenant_name
      properties:
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_name:
          type: string

