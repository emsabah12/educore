        the owning Employee already has a different ACTIVE Employment
        (INV-HR-002).
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The activated Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

