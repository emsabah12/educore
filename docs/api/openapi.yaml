          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The Employee's detail, including Employment history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEmployeeDetailSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; or the current organizational
            assignment does not have hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employees/{employeeId}/create-account:
    post:
      operationId: hrWorkspaceEmployeeCreateAccount
      x-laravel-route-name: api.v1.hr.workspace.employees.create-account
      tags:
        - Human Resources
      summary: Create a login account (User) for an Employee that does not have one yet
      description: |
        §Pengaturan Akun Pegawai — an Employee created via
        POST /hr/workspace/employees gets a Person + Membership
        already linked, but NO User (login credential) — this is the
        only endpoint that creates one. Password is generated
        server-side and returned ONLY in this response, never
        logged or retrievable again. Filters from the exact same
        visibility query as GET /hr/workspace/employees (HR-013 §6)
        — an Employee outside the current workspace returns 404,
        identical to one that does not exist.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - name: employeeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
      responses:
        "201":
          description: Login account created; generated password shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAccountCreatedSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; organizational context
            is missing or invalid; or the current organizational
            assignment does not have hr.employees.create permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Employee was not found in the current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNotFoundError"

        "409":
          description: This Employee's Person already has a login account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAccountConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employment-types:
    get:
      operationId: hrEmploymentTypeIndex
      x-laravel-route-name: api.v1.hr.employment-types.index
      tags:
        - Human Resources
      summary: List the current tenant's Employment Type catalog
      description: |
        HR-002 §3 (OD-HR-DATA-002) — Employment Type is a tenant-scoped
        catalog (e.g. TETAP / KONTRAK / HONORER), never a global enum.
        Read-only; powers pickers such as the Tambah Employment form.
        Deliberately tenant-wide, not organizational-scoped — supports
        BearerAuth and BrowserSessionAuth but requires no organizational
        context header. Returns both active and inactive entries; the
        presentation layer decides which to offer for selection.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: The tenant's Employment Type catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTypeListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.employments.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrEmploymentTypeStore
      x-laravel-route-name: api.v1.hr.employment-types.store
      tags:
        - Human Resources
      summary: Create a new Employment Type catalog entry for the current tenant
      description: |
        HR-002 §3 (OD-HR-DATA-002) — adds one entry to the tenant's
        Employment Type catalog (e.g. TETAP / KONTRAK / HONORER).
        `code` must be unique within the tenant. Newly created entries
        default to is_active=true; deactivation has no dedicated
        endpoint yet.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  maxLength: 50
                name:
                  type: string
                  maxLength: 100
                description:
                  type:
                    - string
                    - "null"
      responses:
        "201":
          description: Employment Type catalog entry created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTypeCreatedSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
