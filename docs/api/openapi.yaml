      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRolePermissionsRequest"
      responses:
        "200":
          description: The updated custom Role, including its new permission set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCustomRoleDetailSuccess"

        "401":
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequiredError"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched; or the current
            membership does not have tenant.custom-roles.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "409":
          description: The Role is currently not editable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomRoleNotEditableError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenant-subscription/effective-features:
    get:
      operationId: tenantEffectiveFeaturesIndex
      x-laravel-route-name: api.v1.core.tenant-subscription.effective-features
      tags:
