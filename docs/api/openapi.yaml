        operation.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: organization
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
        - $ref: "#/components/parameters/OrganizationalAssignmentUnitFilter"
      responses:
        "200":
          description: The Organization's assignments, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalAssignmentListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication context missing/invalid, or the current
            Membership does not have organization.assignments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: coreOrganizationalAssignmentStore
      x-laravel-route-name: api.v1.core.organizations.assignments.store
      tags:
        - Core
      summary: Place a Membership into an Organization or one of its Units
      description: |
        `organization_unit_id` selects the mode: present → exact-Unit
        assignment, omitted/null → organization-level assignment
        (ADR-018 §2.3). Idempotent — re-assigning an already-active
        placement, or reactivating a previously deactivated one,
        both succeed and return the same underlying row. Requires
        organization.assignments.manage permission. Existence and
        tenant/Organization scope of membership_id and
        organization_unit_id are validated as 422 field errors, not
        404 — see StoreOrganizationalAssignmentRequest.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: organization
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrganizationalAssignmentRequest"
      responses:
        "201":
          description: The created or reactivated assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalAssignmentDetailSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication context missing/invalid, or the current
            Membership does not have organization.assignments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/organizations/{organization}/assignments/{assignment}/deactivate:
    post:
      operationId: coreOrganizationalAssignmentDeactivate
      x-laravel-route-name: api.v1.core.organizations.assignments.deactivate
      tags:
        - Core
      summary: Deactivate one OrganizationalAssignment
      description: |
        Idempotent — deactivating an already-INACTIVE assignment
        still succeeds and returns it unchanged. An assignment id
        that belongs to a different Organization than the URL states
        returns 404, identical to one that does not exist at all.
        Requires organization.assignments.manage permission.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: organization
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
        - name: assignment
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: The now-inactive assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationalAssignmentDetailSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication context missing/invalid, or the current
            Membership does not have organization.assignments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/organizations/{organization}/assignments/candidate-memberships:
    get:
      operationId: coreOrganizationalAssignmentCandidateMembershipIndex
      x-laravel-route-name: api.v1.core.organizations.assignments.candidate-memberships
      tags:
        - Core
      summary: Search ACTIVE tenant Memberships by Person name for the assign picker
      description: |
        TENANT-level (Membership is Person × Tenant, never
        organization-scoped — ADR-018 §2.3); the {organization} path
        segment exists only to keep this endpoint's permission
        gating and URL namespace consistent with the rest of the
        "assign member" flow, not because results are filtered by
        it. Deliberately narrow: exists only to feed this flow, not
        as a general-purpose people directory — gated by
        organization.assignments.manage rather than a new, broader
        permission. q shorter than 2 characters returns an empty
        array rather than an error. Results are capped at 10,
        ordered by name.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: organization
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
        - $ref: "#/components/parameters/MembershipCandidateSearchQuery"
      responses:
        "200":
          description: |
            Up to 10 matching ACTIVE Memberships, ordered by Person
            name. Empty when q is omitted or shorter than 2
            characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipCandidateListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication context missing/invalid, or the current
            Membership does not have organization.assignments.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/user/my-memberships:
    get:
      operationId: userMembershipIndex
      x-laravel-route-name: api.v1.user.memberships.index
      tags:
        - User Context
      summary: List active memberships owned by the authenticated Person
      description: |
        Supports BearerAuth and BrowserSessionAuth at User identity scope.
        X-EduCore-Membership-Id is intentionally not required because this
        operation discovers the Memberships available to the authenticated
        Person.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      responses:
        "200":
          description: Person-owned active membership projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipListSuccess"

        "401":
          description: |
            Authentication is required for the selected Bearer or Browser
            Session transport.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationRequiredError"
                  - $ref: "#/components/schemas/BrowserSessionAuthenticationRequiredError"

        "403":
          description: |
            Browser Session identity context does not match the canonical
            authenticated identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/memberships/{membership_id}/switch:
    post:
      operationId: userMembershipSwitch
      x-laravel-route-name: api.v1.user.memberships.switch
      tags:
        - User Context
      summary: Exchange the current token for another owned membership context
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: |
            New bearer token issued for the selected Membership and Tenant.
            The previously issued token is not implicitly revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipSwitchSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/MembershipSwitchDenied"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/browser/user/memberships/{membership_id}/switch:
    post:
      operationId: browserUserMembershipSwitch
      x-laravel-route-name: api.v1.browser.user.memberships.switch
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
        - User Context
      summary: Prepare another canonical Membership credential inside Browser Session custody
      description: |
        Uses Browser Session identity and the canonical Membership switch action
        to validate ownership and Tenant availability. The newly issued bearer
        is stored server-side and the previously prepared Membership credential
        remains available for independent browser tabs.

        The browser response never includes access_token and no global active
        Membership is written into the shared session.
      security:
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/BrowserMembershipPathId"
      responses:
        "200":
          description: Target Membership credential prepared in server-side Browser Session custody.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserMembershipSwitchSuccess"
        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"
        "403":
          $ref: "#/components/responses/MembershipSwitchDenied"
        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/my-workspaces:
    get:
      operationId: userWorkspaceIndex
      x-laravel-route-name: api.v1.user.workspaces.index
      tags:
        - User Context
      summary: Discover active organizational workspaces for the current membership
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require the header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Available frontend workspace projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiscoverySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/user/memberships/{target_membership_id}/assign-role:
    post:
      operationId: userMembershipRoleAssign
      x-laravel-route-name: api.v1.user.rbac.assign
      tags:
        - User Context
        - Authorization
      summary: Assign a global role to a membership as a tenant administrator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TargetMembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipRoleAssignmentRequest"
      responses:
        "200":
          description: Membership role assignment completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipRoleAssignmentSuccess"

        "403":
          description: |
            Tenant authentication context is invalid or the authenticated
            Membership does not have the required administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          $ref: "#/components/responses/MembershipRoleAssignmentRejected"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        EduCore encrypted opaque bearer token.

        The token establishes authenticated User, Membership, and Tenant
        context. Roles, permissions, capabilities, organizational
        assignments, and workspace authority are intentionally not encoded
        as trusted authorization claims.

    BrowserSessionAuth:
      type: apiKey
      in: cookie
      name: __Host-educore-session
      description: |
        First-party same-origin Browser Session credential. Production uses a
        host-only Secure HttpOnly SameSite=Strict __Host- session cookie.

        Canonical bearer credentials remain exclusively in server-side
        Browser Session custody and are never exposed to JavaScript.

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID accepted without a version-specific HTTP constraint.

    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: RFC 9562 UUID version 7 identifier.

    MembershipPathIdentifier:
      type: string
      minLength: 1
      description: |
        Membership route identifier.

        The current HTTP/application path does not perform explicit UUIDv7
        validation before repository lookup. This schema intentionally does
        not claim a version-specific validation contract.

    PermissionName:
      type: string
      minLength: 1
      description: Canonical machine-readable permission name.

    LoginTokenRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Global User login identifier.

            Values containing @ are resolved through the canonical email
            identity path. Other values are resolved through the canonical
            username identity path.
        password:
          type: string
          minLength: 6
      description: |
        Global authentication request.

        Tenant, Membership, Workspace, Role, and Permission context are
        intentionally absent. Authentication establishes User identity before
        any Membership or Tenant selection occurs.

    AuthenticationTokenContext:
      type: object
      required:
        - user_id
        - name
        - email
        - membership_id
        - tenant_id
      properties:
        user_id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        email:
          type: string
          format: email
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"

    AuthenticationTokenData:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - context
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        context:
          $ref: "#/components/schemas/AuthenticationTokenContext"

    LoginTokenSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/AuthenticationTokenData"

    LogoutSuccess:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.
        data:
          type: object
          required:
            - token_revoked
          properties:
            token_revoked:
              type: boolean
              const: true

    BrowserLoginData:
      type: object
      additionalProperties: false
      required:
        - context_type
        - user
        - platform
      properties:
        context_type:
          type: string
          const: identity
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - email
            - username
          properties:
            id:
              $ref: "#/components/schemas/UuidV7"
            name:
              type: string
            email:
              type: string
              format: email
            username:
              type:
                - string
                - "null"
        platform:
          type: object
          additionalProperties: false
          required:
            - is_superadmin
          properties:
            is_superadmin:
              type: boolean

    BrowserLoginSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserLoginData"

    GlobalIdentitySuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserLoginData"

    BrowserLogoutSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.

    BrowserMembershipSwitchData:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - tenant_id
        - tenant_name
      properties:
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_name:
          type: string

    BrowserMembershipSwitchSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserMembershipSwitchData"

    AuthenticatedUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        email:
          type: string
          format: email

    AuthenticatedPerson:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string

    AuthenticatedMembership:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        status:
          type: string
          const: ACTIVE

    AuthenticatedTenant:
      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type:
            - string
            - "null"

    AuthenticatedBootstrapData:
      type: object
      required:
        - user
        - person
        - membership
        - tenant
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        person:
          $ref: "#/components/schemas/AuthenticatedPerson"
        membership:
          $ref: "#/components/schemas/AuthenticatedMembership"
        tenant:
          $ref: "#/components/schemas/AuthenticatedTenant"

    AuthenticatedBootstrapSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/AuthenticatedBootstrapData"

    TenantCapabilityScope:
      type: object
      required:
        - type
        - tenant_id
        - membership_id
      properties:
        type:
          type: string
          const: tenant
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"

    TenantCapabilityData:
      type: object
      required:
        - scope
        - is_global_superadmin
        - permissions
      properties:
        scope:
          $ref: "#/components/schemas/TenantCapabilityScope"
        is_global_superadmin:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionName"

    TenantCapabilitySuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/TenantCapabilityData"

    WorkspaceCapabilityScope:
      type: object
      required:
        - type
        - tenant_id
        - membership_id
        - organizational_assignment_id
        - organization_id
        - organization_unit_id
      properties:
        type:
          type: string
          enum:
            - organization
            - organization_unit
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        organizational_assignment_id:
          $ref: "#/components/schemas/UuidV7"
        organization_id:
          $ref: "#/components/schemas/UuidV7"
        organization_unit_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"

    WorkspaceCapabilityData:
      type: object
      required:
        - scope
        - is_global_superadmin
        - permissions
      properties:
        scope:
          $ref: "#/components/schemas/WorkspaceCapabilityScope"
        is_global_superadmin:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionName"

    WorkspaceCapabilitySuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/WorkspaceCapabilityData"

    RoleSummary:
      type: object
      required:
        - id
        - name
        - display_name
        - description
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        display_name:
          type: string
        description:
          type:
            - string
            - "null"

    RoleCatalogSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"

    HealthComponent:
      type: object
      required:
        - healthy
        - message
      properties:
        healthy:
          type: boolean
        message:
          type: string

    HealthComponents:
      type: object
      required:
        - database
        - storage
      properties:
        database:
          $ref: "#/components/schemas/HealthComponent"
        storage:
          $ref: "#/components/schemas/HealthComponent"

    HealthStatus:
      type: object
      required:
        - status
        - timestamp
        - components
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        timestamp:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/HealthComponents"

    NotificationOptions:
      type:
        - object
        - "null"
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 200
      additionalProperties: false

    NotificationDispatchRequest:
      type: object
      required:
        - recipient
        - body
      properties:
        recipient:
          type: string
          maxLength: 150
          description: Trimmed before validation output is consumed.
        body:
          type: string
          maxLength: 5000
          description: Trimmed before validation output is consumed.
        options:
          $ref: "#/components/schemas/NotificationOptions"

    NotificationDispatchSuccess:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Notification dispatch has been accepted and queued for transmission.

    TenantListItem:
      type: object
      required:
        - id
        - name
        - subdomain
        - domain
        - is_active
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type: string
        domain:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        created_at:
          type: string
          description: Raw persisted timestamp returned by the query builder.

    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TenantListSuccess:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StoreTenantRequest:
      type: object
      required:
        - name
        - subdomain
        - initial_admin_user_id
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Trimmed before validation.
        subdomain:
          type: string
          maxLength: 50
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,48}[a-z0-9])?$"
          description: Trimmed and converted to lowercase before validation.
        is_active:
          type: boolean
        initial_admin_user_id:
          $ref: "#/components/schemas/UuidV7"

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Trimmed before validation.
        is_active:
          type: boolean
      anyOf:
        - required:
            - name
        - required:
            - is_active

    TenantResource:
      type: object
      required:
        - id
        - name
        - subdomain
        - domain
        - is_active
        - settings
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type: string
        domain:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        settings:
          type:
            - string
            - "null"
          description: |
            Raw JSON database value returned by the query-builder repository.
            The current repository does not hydrate this field through the
            Tenant model cast before returning the HTTP projection.
        created_at:
          type: string
        updated_at:
          type: string
        deleted_at:
          type:
            - string
            - "null"

    EmployeeResource:
      type: object
      additionalProperties: false
      required:
        - employee_id
        - membership_id
        - person_id
        - tenant_id
        - nip
        - jabatan
        - nama
        - membership_status
        - created_at
      properties:
        employee_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        person_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        nip:
          type:
            - string
            - "null"
          description: Tenant-scoped unique employee identification number.
