            application/json:
              schema:
                $ref: "#/components/schemas/TenantMembershipListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current
            Membership does not have the required tenant
            administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        EduCore encrypted opaque bearer token.

        The token establishes authenticated User, Membership, and Tenant
        context. Roles, permissions, capabilities, organizational
        assignments, and workspace authority are intentionally not encoded
        as trusted authorization claims.

    BrowserSessionAuth:
      type: apiKey
      in: cookie
      name: __Host-educore-session
      description: |
        First-party same-origin Browser Session credential. Production uses a
        host-only Secure HttpOnly SameSite=Strict __Host- session cookie.

        Canonical bearer credentials remain exclusively in server-side
        Browser Session custody and are never exposed to JavaScript.

  schemas:
    Uuid:
      type: string
      format: uuid
      description: UUID accepted without a version-specific HTTP constraint.

    UuidV7:
      type: string
      format: uuid
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
      description: RFC 9562 UUID version 7 identifier.

    MembershipPathIdentifier:
      type: string
      minLength: 1
      description: |
        Membership route identifier.

        The current HTTP/application path does not perform explicit UUIDv7
        validation before repository lookup. This schema intentionally does
        not claim a version-specific validation contract.

    PermissionName:
      type: string
      minLength: 1
      description: Canonical machine-readable permission name.

    LoginTokenRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Global User login identifier.

            Values containing @ are resolved through the canonical email
            identity path. Other values are resolved through the canonical
            username identity path.
        password:
          type: string
          minLength: 6
      description: |
        Global authentication request.

        Tenant, Membership, Workspace, Role, and Permission context are
        intentionally absent. Authentication establishes User identity before
        any Membership or Tenant selection occurs.

    AuthenticationTokenContext:
      type: object
      required:
        - user_id
        - name
        - email
        - membership_id
        - tenant_id
      properties:
        user_id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        email:
          type: string
          format: email
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"

    AuthenticationTokenData:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - context
      properties:
        access_token:
          type: string
          minLength: 1
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        context:
          $ref: "#/components/schemas/AuthenticationTokenContext"

    LoginTokenSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/AuthenticationTokenData"

    LogoutSuccess:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.
        data:
          type: object
          required:
            - token_revoked
          properties:
            token_revoked:
              type: boolean
              const: true

    BrowserLoginData:
      type: object
      additionalProperties: false
      required:
        - context_type
        - user
        - platform
      properties:
        context_type:
          type: string
          const: identity
        user:
          type: object
          additionalProperties: false
          required:
            - id
            - name
            - email
            - username
          properties:
            id:
              $ref: "#/components/schemas/UuidV7"
            name:
              type: string
            email:
              type: string
              format: email
            username:
              type:
                - string
                - "null"
        platform:
          type: object
          additionalProperties: false
          required:
            - is_superadmin
          properties:
            is_superadmin:
              type: boolean

    BrowserLoginSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserLoginData"

    GlobalIdentitySuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserLoginData"

    BrowserLogoutSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Logout completed successfully.

    BrowserMembershipSwitchData:
      type: object
      additionalProperties: false
      required:
        - membership_id
        - tenant_id
        - tenant_name
      properties:
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_name:
          type: string

    BrowserMembershipSwitchSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/BrowserMembershipSwitchData"

    AuthenticatedUser:
      type: object
      required:
        - id
        - email
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        email:
          type: string
          format: email

    AuthenticatedPerson:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string

    AuthenticatedMembership:
      type: object
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        status:
          type: string
          const: ACTIVE

    AuthenticatedTenant:
      type: object
      required:
        - id
        - name
        - subdomain
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type:
            - string
            - "null"

    AuthenticatedBootstrapData:
      type: object
      required:
        - user
        - person
        - membership
        - tenant
      properties:
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
        person:
          $ref: "#/components/schemas/AuthenticatedPerson"
        membership:
          $ref: "#/components/schemas/AuthenticatedMembership"
        tenant:
          $ref: "#/components/schemas/AuthenticatedTenant"

    AuthenticatedBootstrapSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/AuthenticatedBootstrapData"

    TenantCapabilityScope:
      type: object
      required:
        - type
        - tenant_id
        - membership_id
      properties:
        type:
          type: string
          const: tenant
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"

    TenantCapabilityData:
      type: object
      required:
        - scope
        - is_global_superadmin
        - is_tenant_admin
        - permissions
      properties:
        scope:
          $ref: "#/components/schemas/TenantCapabilityScope"
        is_global_superadmin:
          type: boolean
        is_tenant_admin:
          type: boolean
          description: |
            §Kelola Anggota & Role — murni untuk visibilitas UI.
            Dihitung dari role literal 'admin' (hasRole), SAMA
            PERSIS dengan pemeriksaan yang menggerbang endpoint
            RBAC-management sesungguhnya (tenant.role:admin) —
            bukan otorisasi baru, cuma proyeksi dari yang sudah
            ditegakkan middleware.
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionName"

    TenantCapabilitySuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/TenantCapabilityData"

    WorkspaceCapabilityScope:
      type: object
      required:
        - type
        - tenant_id
        - membership_id
        - organizational_assignment_id
        - organization_id
        - organization_unit_id
      properties:
        type:
          type: string
          enum:
            - organization
            - organization_unit
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        organizational_assignment_id:
          $ref: "#/components/schemas/UuidV7"
        organization_id:
          $ref: "#/components/schemas/UuidV7"
        organization_unit_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"

    WorkspaceCapabilityData:
      type: object
      required:
        - scope
        - is_global_superadmin
        - permissions
      properties:
        scope:
          $ref: "#/components/schemas/WorkspaceCapabilityScope"
        is_global_superadmin:
          type: boolean
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PermissionName"

    WorkspaceCapabilitySuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/WorkspaceCapabilityData"

    RoleSummary:
      type: object
      required:
        - id
        - name
        - display_name
        - description
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        display_name:
          type: string
        description:
          type:
            - string
            - "null"

    RoleCatalogSuccess:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"

    TenantMembershipSummary:
      type: object
      additionalProperties: false
      description: |
        §Kelola Anggota & Role — satu Membership AKTIF dalam tenant
        yang sedang otentikasi, beserta role yang sudah dipunya saat
        ini (bisa kosong kalau belum pernah di-assign apa pun).
      required:
        - membership_id
        - person_name
        - email
        - roles
      properties:
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        person_name:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"

    TenantMembershipListSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantMembershipSummary"

    HealthComponent:
      type: object
      required:
        - healthy
        - message
      properties:
        healthy:
          type: boolean
        message:
          type: string

    HealthComponents:
      type: object
      required:
        - database
        - storage
      properties:
        database:
          $ref: "#/components/schemas/HealthComponent"
        storage:
          $ref: "#/components/schemas/HealthComponent"

    HealthStatus:
      type: object
      required:
        - status
        - timestamp
        - components
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
        timestamp:
          type: string
          format: date-time
        components:
          $ref: "#/components/schemas/HealthComponents"

    NotificationOptions:
      type:
        - object
        - "null"
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 200
      additionalProperties: false

    NotificationDispatchRequest:
      type: object
      required:
        - recipient
        - body
      properties:
        recipient:
          type: string
          maxLength: 150
          description: Trimmed before validation output is consumed.
        body:
          type: string
          maxLength: 5000
          description: Trimmed before validation output is consumed.
        options:
          $ref: "#/components/schemas/NotificationOptions"

    NotificationDispatchSuccess:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          const: success
        message:
          type: string
          const: Notification dispatch has been accepted and queued for transmission.

    TenantListItem:
      type: object
      required:
        - id
        - name
        - subdomain
        - domain
        - is_active
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type: string
        domain:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        created_at:
          type: string
          description: Raw persisted timestamp returned by the query builder.

    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0

    TenantListSuccess:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/TenantListItem"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    StoreTenantRequest:
      type: object
      required:
        - name
        - subdomain
        - initial_admin_user_id
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Trimmed before validation.
        subdomain:
          type: string
          maxLength: 50
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,48}[a-z0-9])?$"
          description: Trimmed and converted to lowercase before validation.
        is_active:
          type: boolean
        initial_admin_user_id:
          $ref: "#/components/schemas/UuidV7"

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 255
          description: Trimmed before validation.
        is_active:
          type: boolean
      anyOf:
        - required:
            - name
        - required:
            - is_active

    TenantResource:
      type: object
      required:
        - id
        - name
        - subdomain
        - domain
        - is_active
        - settings
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        name:
          type: string
        subdomain:
          type: string
        domain:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        settings:
          type:
            - string
            - "null"
          description: |
            Raw JSON database value returned by the query-builder repository.
            The current repository does not hydrate this field through the
            Tenant model cast before returning the HTTP projection.
        created_at:
          type: string
        updated_at:
          type: string
        deleted_at:
          type:
            - string
            - "null"

    EmployeeResource:
      type: object
      additionalProperties: false
      required:
        - employee_id
        - membership_id
        - person_id
        - tenant_id
        - nip
        - jabatan
        - nama
        - membership_status
        - created_at
      properties:
        employee_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        person_id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        nip:
          type:
            - string
            - "null"
          description: Tenant-scoped unique employee identification number.
        jabatan:
          type: string
          enum:
            - GURU
            - KEPALA_SEKOLAH
            - STAFF
          description: |
            Legacy compatibility field (GAP-001 / HR-002 OD-HR-DATA-006).
            Not the canonical position/Employment source going forward.
        nama:
          type: string
          description: Canonical Person name, not duplicated on Employee.
        membership_status:
          type: string
        created_at:
          type: string
          description: Raw persisted timestamp returned by the query builder.

    EmployeeListSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    EmploymentListSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    WorkspaceEmployeeResource:
      type: object
      additionalProperties: false
      description: |
        Field shape is intentionally distinct from EmployeeResource: this
        endpoint hydrates the Eloquent Employee model directly (employees.*)
        rather than the tenant-scoped listing's raw aliased query, so the
        primary key is `id` (not `employee_id`) and there is no separate
        `person_id`/`membership_status` projection.
      required:
        - id
        - tenant_id
        - membership_id
        - nip
        - jabatan
        - nama
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        nip:
          type:
            - string
            - "null"
          description: Tenant-scoped unique employee identification number.
        jabatan:
          type: string
          enum:
            - GURU
            - KEPALA_SEKOLAH
            - STAFF
          description: |
            Legacy compatibility field (GAP-001 / HR-002 OD-HR-DATA-006).
            Not the canonical position/Employment source going forward.
        nama:
          type: string
          description: Canonical Person name, not duplicated on Employee.
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time

    WorkspaceEmployeeListSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: string
          const: success
        data:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEmployeeResource"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    WorkspaceEmployeeEmployment:
      type: object
      additionalProperties: false
      description: One Employment episode (HR-002 §5.5), most recent first.
      required:
        - id
        - employment_type
        - status
        - start_date
        - end_date
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        employment_type:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - PLANNED
            - ACTIVE
            - ENDED
            - CANCELLED
        start_date:
          type: string
          format: date
        end_date:
          type:
            - string
            - "null"
          format: date

    WorkspaceEmployeeDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - membership_id
        - nip
        - jabatan
        - nama
        - created_at
        - employments
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        membership_id:
          $ref: "#/components/schemas/UuidV7"
        nip:
          type:
            - string
            - "null"
        jabatan:
          type: string
          enum:
            - GURU
            - KEPALA_SEKOLAH
            - STAFF
        nama:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
        employments:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEmployeeEmployment"

    WorkspaceEmployeeDetailSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - data
      properties:
        status:
          type: string
          const: success
        data:
          $ref: "#/components/schemas/WorkspaceEmployeeDetail"

    EmploymentResource:
      type: object
      additionalProperties: false
      description: |
        Raw Employment record (HR-002 §5.5) as returned by the lifecycle
        transition endpoints — a different, richer shape than
        WorkspaceEmployeeEmployment (which is a joined summary used only
        by the read-only employee detail view).
      required:
        - id
        - tenant_id
        - employee_id
        - employment_type_id
        - employment_classification_id
        - status
        - start_date
        - end_date
        - cancelled_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        employee_id:
          $ref: "#/components/schemas/UuidV7"
        employment_type_id:
          type:
            - string
            - "null"
        employment_classification_id:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - PLANNED
            - ACTIVE
            - ENDED
            - CANCELLED
        start_date:
          type: string
          format: date
        end_date:
          type:
            - string
            - "null"
          format: date
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time

    EmploymentTransitionSuccess:
      type: object
      additionalProperties: false
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          const: success
        message:
          type: string
        data:
          $ref: "#/components/schemas/EmploymentResource"

    EndEmploymentRequest:
      type: object
      additionalProperties: false
      required:
        - end_date
      properties:
        end_date:
          type: string
          format: date
          description: Must not be before the Employment's start_date, and never in the future.

    EmployeeOutOfOrganizationalScopeError:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          const: EMPLOYEE_OUT_OF_ORGANIZATIONAL_SCOPE
        message:
          type: string

    EmploymentNotFoundError:
      type: object
      additionalProperties: false
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          const: EMPLOYMENT_NOT_FOUND
        message:
          type: string

    EmploymentLifecycleConflictError:
      type: object
      additionalProperties: false
      description: |
        E.g. activating an Employment that is not PLANNED, or ending one
        that is not ACTIVE.
      required:
        - status
        - code
        - message
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          const: EMPLOYMENT_LIFECYCLE_CONFLICT
