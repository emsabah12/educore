        - name: assignmentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - compensation_component_id
                - currency_code
                - effective_from
              properties:
                compensation_component_id:
                  $ref: "#/components/schemas/UuidV7"
                employment_position_assignment_id:
                  oneOf:
                    - $ref: "#/components/schemas/UuidV7"
                    - type: "null"
                amount:
                  type:
                    - number
                    - "null"
                  exclusiveMinimum: 0
                rate:
                  type:
                    - number
                    - "null"
                  exclusiveMinimum: 0
                currency_code:
                  type: string
                  pattern: "^[A-Z]{3}$"
                effective_from:
                  type: string
                  format: date
                effective_to:
                  type:
                    - string
                    - "null"
                  format: date
                reason:
                  type:
                    - string
                    - "null"
      responses:
        "200":
          description: New corrected DRAFT Compensation Assignment created; original marked SUPERSEDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompensationAssignmentActionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.compensation.assignments.approve
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: |
