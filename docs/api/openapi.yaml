openapi: 3.1.0

info:
  title: EduCore Foundation API
  version: 1.0.0-foundation
  description: |
    Canonical HTTP contract for the EduCore foundation surface.

    This specification currently documents the stable Core, Auth, User, and
    first-party Browser BFF foundation APIs.

    Academic and HR APIs remain public Laravel routes but are explicitly
    recorded under x-educore-deferred-routes until their domain API boundary,
    validation, and canonical error contracts are hardened.

servers:
  - url: /

tags:
  - name: Authentication
  - name: Browser Session
  - name: Authorization
  - name: Core Platform
  - name: Tenancy
  - name: User Context
  - name: Human Resources

paths:
  /api/v1/auth/login-token:
    post:
      operationId: authLoginToken
      x-laravel-route-name: api.v1.auth.login-token
      tags:
        - Authentication
      summary: Authenticate a global User identity
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginTokenSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      x-laravel-route-name: api.v1.auth.logout
      tags:
        - Authentication
      summary: Revoke the current bearer token
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/auth/me:
    get:
      operationId: authBootstrapContext
      x-laravel-route-name: api.v1.auth.me
      tags:
        - Authentication
      summary: Return the authenticated frontend bootstrap context
      description: |
        Supports canonical Bearer clients and first-party Browser Session
        clients. BrowserSessionAuth requires X-EduCore-Membership-Id to select
        one server-held Membership credential. The header is a locator only
        and is not required for BearerAuth.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Authenticated frontend bootstrap context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedBootstrapSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/auth/identity:
    get:
      operationId: authIdentity
      x-laravel-route-name: api.v1.auth.identity
      tags:
        - Authentication
      summary: Return the canonical global authenticated identity
      description: |
        Supports BearerAuth and BrowserSessionAuth at User identity scope.
        This operation intentionally never establishes or exposes
        Membership, Tenant, Workspace, Role, or Permission context —
        X-EduCore-Membership-Id is not accepted here.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      responses:
        "200":
          description: Global authenticated identity projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalIdentitySuccess"

        "401":
          description: |
            Authentication is required for the selected Bearer or Browser
            Session transport.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationRequiredError"
                  - $ref: "#/components/schemas/BrowserSessionAuthenticationRequiredError"

  /api/v1/browser/session/csrf:
    get:
      operationId: browserSessionCsrfBootstrap
      x-laravel-route-name: api.v1.browser.session.csrf
      tags:
        - Browser Session
      summary: Bootstrap the browser session and request-forgery cookie pair
      description: |
        Starts or resumes the server-side Laravel browser session and emits
        the anti-forgery cookie pair used by the first-party same-origin SPA.

        The response intentionally contains no authentication material.
      security: []
      responses:
        "204":
          description: Browser session / request-forgery bootstrap completed with no response body.

  /api/v1/browser/auth/login:
    post:
      operationId: browserAuthLogin
      x-laravel-route-name: api.v1.browser.auth.login
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Authenticate a global User into a server-side Browser Session
      description: |
        Authenticates the global User identity, regenerates the
        pre-authentication session identifier, and establishes identity-only
        Browser Session state.

        Fresh Browser login does not select a Membership or Tenant, does not
        issue a browser-visible bearer credential, and never includes
        access_token in the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginTokenRequest"
      responses:
        "200":
          description: Global Browser identity authentication succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLoginSuccess"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/browser/auth/logout:
    post:
      operationId: browserAuthLogout
      x-laravel-route-name: api.v1.browser.auth.logout
      x-educore-request-forgery-protected: true
      tags:
        - Browser Session
      summary: Revoke Browser Session credentials and invalidate the shared session
      description: |
        Best-effort revokes every canonical bearer credential currently held
        by the shared Browser Session Broker, clears credential custody,
        invalidates the session identifier, and rotates the CSRF token.

        Logout is intentionally idempotent for an anonymous browser session.
      security:
        - BrowserSessionAuth: []
        - {}
      responses:
        "200":
          description: Browser logout completed successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserLogoutSuccess"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"

  /api/v1/core/authorization/capabilities:
    get:
      operationId: authorizationTenantCapabilities
      x-laravel-route-name: api.v1.core.authorization.capabilities.index
      tags:
        - Authorization
      summary: Project effective tenant capabilities
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require the header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Effective tenant capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, mismatched, or denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"

        "422":
          $ref: "#/components/responses/InvalidBrowserMembershipId"

        "500":
          $ref: "#/components/responses/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/workspace-capabilities:
    get:
      operationId: authorizationWorkspaceCapabilities
      x-laravel-route-name: api.v1.core.authorization.workspace-capabilities.index
      tags:
        - Authorization
      summary: Project effective capabilities for the selected organizational workspace
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select the canonical Membership
        context. X-EduCore-Organizational-Assignment-Id remains required for
        both transports and is a locator only.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
      responses:
        "200":
          description: Effective workspace capability projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCapabilitySuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Tenant authentication, Browser Session Membership, or
            organizational context is missing, unavailable, mismatched, or
            denied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/BrowserMembershipContextRequiredError"
                  - $ref: "#/components/schemas/BrowserMembershipContextDeniedError"
                  - $ref: "#/components/schemas/BrowserSessionContextMismatchError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/OrganizationalContextDeniedError"

        "422":
          description: |
            Browser Membership or organizational assignment locator validation
            failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidBrowserMembershipIdError"
                  - $ref: "#/components/schemas/InvalidOrganizationalAssignmentIdError"

        "500":
          description: |
            Organizational context resolution or capability projection
            failed unexpectedly.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrganizationalContextResolutionFailedError"
                  - $ref: "#/components/schemas/InternalServerError"

        "503":
          $ref: "#/components/responses/BrowserSessionUnavailable"

  /api/v1/core/authorization/roles:
    get:
      operationId: authorizationRoleCatalog
      x-laravel-route-name: api.v1.core.authorization.roles.index
      tags:
        - Authorization
      summary: Return the safe global role catalog for tenant administrators
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Safe role catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleCatalogSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Tenant authentication context is invalid or the current Membership
            does not have the required tenant administrator role.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/health:
    get:
      operationId: coreHealth
      x-laravel-route-name: api.core.health
      tags:
        - Core Platform
      summary: Return platform health status
      security: []
      responses:
        "200":
          description: Platform is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

        "503":
          description: |
            At least one monitored platform component is unhealthy.

            The response intentionally uses the HealthStatus representation
            rather than the canonical business ApiError envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/core/notifications/dispatch:
    post:
      operationId: notificationDispatch
      x-laravel-route-name: api.v1.core.notifications.dispatch
      tags:
        - Core Platform
      summary: Queue a tenant-scoped notification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDispatchRequest"
      responses:
        "202":
          description: Notification accepted for asynchronous delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchSuccess"

        "403":
          $ref: "#/components/responses/AuthenticationContextDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/NotificationDispatchFailed"

  /api/v1/core/tenants:
    get:
      operationId: tenantIndex
      x-laravel-route-name: api.v1.core.tenants.index
      tags:
        - Tenancy
      summary: List tenants as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantPerPage"
      responses:
        "200":
          description: Paginated tenant collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: tenantStore
      x-laravel-route-name: api.v1.core.tenants.store
      tags:
        - Tenancy
      summary: Provision a tenant as a global superadmin
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreTenantRequest"
      responses:
        "201":
          description: Tenant and initial tenant administrator created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantCreatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/core/tenants/{id}:
    put:
      operationId: tenantUpdate
      x-laravel-route-name: api.v1.core.tenants.update
      tags:
        - Tenancy
      summary: Update a tenant as a global superadmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: Tenant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantUpdatedSuccess"

        "401":
          $ref: "#/components/responses/AuthenticationRequired"

        "403":
          $ref: "#/components/responses/AuthorizationDenied"

        "404":
          $ref: "#/components/responses/ResourceNotFound"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/employees:
    get:
      operationId: hrEmployeeIndex
      x-laravel-route-name: api.v1.hr.employees.index
      tags:
        - Human Resources
      summary: List Employees for the current tenant
      description: >
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require that header.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeePerPage"
        - $ref: "#/components/parameters/EmployeePage"
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Paginated Employee collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListSuccess"

        "403":
          description: |
            Tenant authentication context is invalid, or the current
            Membership does not have hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrEmployeeStore
      x-laravel-route-name: api.v1.hr.employees.store
      tags:
        - Human Resources
      summary: Provision an Employee profile within the current tenant
      description: |
        Atomically creates a Person, Membership, and Employee profile.
        This administrative provisioning path does not create a User
        account for the Employee.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEmployeeRequest"
      responses:
        "201":
          description: Employee profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeCreatedSuccess"

        "403":
          description: |
            Tenant authentication context is invalid, or the current
            Membership does not have hr.employees.create permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/EmployeeProvisioningFailed"

  /api/v1/hr/employees/{employeeId}/employments:
    get:
      operationId: hrEmployeeEmploymentIndex
      x-laravel-route-name: api.v1.hr.employees.employments.index
      tags:
        - Human Resources
      summary: List Employment episodes for an Employee within the current tenant
      description: >
        Tenant-wide (BUKAN Organizational Workspace scope) — dipakai halaman
        Kompensasi & Benefit untuk memilih Employment target sebelum masuk ke
        sub-resource Compensation/Benefit-nya. Supports BearerAuth dan
        BrowserSessionAuth; Browser Session requests require
        X-EduCore-Membership-Id.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
        - $ref: "#/components/parameters/EmployeePerPage"
        - $ref: "#/components/parameters/EmployeePage"
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
      responses:
        "200":
          description: Paginated Employment collection for the given Employee.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentListSuccess"

        "403":
          description: |
            Tenant authentication context is invalid, or the current
            Membership does not have hr.employments.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrEmployeeEmploymentStore
      x-laravel-route-name: api.v1.hr.employees.employments.store
      tags:
        - Human Resources
      summary: Create a new PLANNED Employment episode for an Employee (tenant-wide)
      description: |
        HR-002 §9 — tenant-wide counterpart of
        POST /hr/workspace/employees/{employeeId}/employments (no
        organizational workspace scoping — see controller docblock
        for the tenant-wide HR operations group).
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: employeeId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEmploymentRequest"
      responses:
        "201":
          description: The newly created, PLANNED Employment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentTransitionSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.employments.manage permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Employee was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNotFoundError"

        "409":
          description: |
            The referenced EmploymentType or EmploymentClassification
            catalog entry is not active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmploymentLifecycleConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/hr/workspace/employees:
    get:
      operationId: hrWorkspaceEmployeeIndex
      x-laravel-route-name: api.v1.hr.workspace.employees.index
      tags:
        - Human Resources
      summary: List Employees visible in the current organizational workspace
      description: |
        Supports BearerAuth and BrowserSessionAuth. Browser Session requests
        require X-EduCore-Membership-Id to select a prepared server-held
        Membership credential; Bearer requests do not require that header.
        Both transports require X-EduCore-Organizational-Assignment-Id to
        select the organizational workspace (HR-013 §6 Target Employee
        Scope Rule) — an Employee is only visible here when their current
        Employment Placement resolves to the same Organization (and, when
        the workspace is unit-scoped, the same Organization Unit).
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
        - $ref: "#/components/parameters/EmployeePage"
        - $ref: "#/components/parameters/EmployeePerPage"
      responses:
        "200":
          description: Paginated Employee collection scoped to the current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEmployeeListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, or mismatched; organizational context is missing or
            invalid; or the current organizational assignment does not have
            hr.employees.view permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/OrganizationalContextRequiredError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrWorkspaceEmployeeStore
      x-laravel-route-name: api.v1.hr.workspace.employees.store
      tags:
        - Human Resources
      summary: Provision a new Employee within the current organizational workspace
      description: |
        HR-017 §3 (resolves HR-013 §35) — creates an Employee, an ACTIVE
        Employment, and an open Employment Placement atomically. Supports
        BearerAuth and BrowserSessionAuth; both transports require
        X-EduCore-Organizational-Assignment-Id. `organization_id` /
        `organization_unit_id` are deliberately NOT accepted in the request
        body (HR-017 §3.4 decision #2, LOCKED) — both are always resolved
        from the active OrganizationalContext, never from client input,
        to close a privilege-escalation gap.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - $ref: "#/components/parameters/OrganizationalAssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - nama
                - nip
                - jabatan
                - employment_type_id
              properties:
                nama:
                  type: string
                  maxLength: 255
                nip:
                  type: string
                  maxLength: 50
                jabatan:
                  type: string
                  maxLength: 100
                employment_type_id:
                  $ref: "#/components/schemas/UuidV7"
      responses:
        "201":
          description: Employee provisioned within the current workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEmployeeProvisioningSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is missing,
            unavailable, or mismatched; organizational context is missing or
