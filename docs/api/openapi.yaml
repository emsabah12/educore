  /api/v1/hr/leave-entitlements/{entitlementId}/adjustments:
    post:
      operationId: hrLeaveEntitlementAdjustmentStore
      x-laravel-route-name: api.v1.hr.leave-entitlements.adjustments.store
      tags:
        - Human Resources
      summary: Manually adjust a Leave/Permit Entitlement's balance
      description: |
        HR-004 §15.3 — higher-impact operation, always audited via
        the ledger, guarded by its own hr.leave.balance.adjust
        permission (separate from hr.leave.balance.read).
        `idempotency_key` prevents duplicate adjustment on retry.
        `reason` is written to the HR ledger only — never copied into
        generic Core audit metadata (see schema description).
        `actor_membership_id` is never client-controlled — always the
        authenticated Membership.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: entitlementId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - units_delta
                - idempotency_key
              properties:
                units_delta:
                  description: Nonzero; positive credits, negative debits.
                  type: number
                  not:
                    enum:
                      - 0
                reason:
                  type:
                    - string
                    - "null"
                  maxLength: 1000
                idempotency_key:
                  type: string
                  maxLength: 100
      responses:
        "201":
          description: The balance after this adjustment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveEntitlementAdjustmentSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.leave.balance.adjust permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: LeaveEntitlement was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveEntitlementNotFoundError"

        "409":
          description: The adjustment would drive the balance negative, or another business-rule conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveEntitlementConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

