  /api/v1/hr/benefit-participations/{participationId}/identifiers:
    get:
      operationId: hrBenefitIdentifierIndex
      x-laravel-route-name: api.v1.hr.benefit-participations.identifiers.index
      tags:
        - Human Resources
      summary: List ACTIVE identifiers (e.g. BPJS numbers) for a Benefit Participation, decrypted
      description: |
        HR-006 §7.7 — nested directly under participationId (not
        employmentId) — benefit_program_id is always derived
        server-side from the referenced participation, never from
        client input, so the composite FK can never be "forced" to
        mismatch through this endpoint. Deliberately gated by a
        SEPARATE, more sensitive permission
        (hr.benefit.identifiers.view) from /store
        (hr.benefit.identifiers.manage) — reading a decrypted raw
        identifier is operationally more sensitive than merely
        registering one.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: participationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      responses:
        "200":
          description: ACTIVE identifiers for the participation, values decrypted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitIdentifierListSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.benefit.identifiers.view
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Benefit Participation was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitParticipationNotFoundError"

        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      operationId: hrBenefitIdentifierStore
      x-laravel-route-name: api.v1.hr.benefit-participations.identifiers.store
      tags:
        - Human Resources
      summary: Register a new identifier (e.g. a BPJS number) for a Benefit Participation
      description: |
        HR-006 §7.7 — the raw `value` is encrypted at rest and NEVER
        echoed back in the response, encrypted or otherwise -- only
        metadata (id, identifier_type, status) is returned.
      security:
        - BearerAuth: []
        - BrowserSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/CanonicalBrowserMembershipLocator"
        - name: participationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UuidV7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - identifier_type
                - value
              properties:
                identifier_type:
                  type: string
                  maxLength: 50
                value:
                  description: Raw identifier value (e.g. a BPJS number). Encrypted at rest; never echoed back.
                  type: string
                  maxLength: 255
                issuer:
                  type:
                    - string
                    - "null"
                  maxLength: 150
                issued_at:
                  type:
                    - string
                    - "null"
                  format: date
                expires_at:
                  type:
                    - string
                    - "null"
                  format: date
      responses:
        "201":
          description: Identifier registered (metadata only -- value never echoed back).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitIdentifierCreatedSuccess"

        "401":
          $ref: "#/components/responses/BrowserSessionAuthenticationRequired"

        "403":
          description: |
            Authentication or Browser Session Membership context is
            missing, unavailable, or mismatched, or the current tenant
            membership does not have hr.benefit.identifiers.manage
            permission.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthenticationContextDeniedError"
                  - $ref: "#/components/schemas/SubscriptionFeatureNotAvailableError"
                  - $ref: "#/components/schemas/AuthorizationDeniedError"

        "404":
          description: Benefit Participation was not found in the current tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitParticipationNotFoundError"

        "409":
          description: Duplicate identifier fingerprint, or FK mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitIdentifierConflictError"

        "422":
          $ref: "#/components/responses/ValidationFailed"

        "500":
          $ref: "#/components/responses/InternalServerError"

