  parameters:
    OrganizationalAssignmentId:
      name: X-EduCore-Organizational-Assignment-Id
      in: header
      required: true
      description: |
        UUIDv7 locator for the selected organizational assignment.

        This header is a context locator only. It does not grant authority.
        The backend resolves and verifies the assignment against the current
        Tenant and Membership on every request.
      schema:
        $ref: "#/components/schemas/UuidV7"

    CanonicalBrowserMembershipLocator:
      name: X-EduCore-Membership-Id
      in: header
      required: false
      description: |
        UUIDv7 tab-local locator used only when a canonical operation is
        authenticated with BrowserSessionAuth. It selects one Membership
        credential already prepared in server-side Browser Session custody.

        Omit this header for BearerAuth. The header is never authentication or
        authorization authority and cannot create a Membership context.
      schema:
        $ref: "#/components/schemas/UuidV7"

    BrowserMembershipPathId:
      name: membership_id
      in: path
      required: true
      description: UUIDv7 target Membership locator for Browser Session switch mediation.
      schema:
        $ref: "#/components/schemas/UuidV7"

    TenantPerPage:
      name: per_page
      in: query
      required: false
      description: Number of tenants returned per page. Defaults to 15.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

    OrganizationalAssignmentUnitFilter:
      name: organization_unit_id
      in: query
      required: false
      description: |
        When present, restricts the listing to assignments exactly at
        this Unit. Omit to list every assignment under the
        Organization (organization-level and every Unit combined).
        A value that does not match a real Unit simply yields an
        empty result — it never errors, since existence in this
        collection depends only on the assignment rows, not on the
        Unit's current existence.
      schema:
        $ref: "#/components/schemas/UuidV7"

    MembershipCandidateSearchQuery:
      name: q
      in: query
      required: false
      description: |
        Case-insensitive substring match against the Person's name.
        Fewer than 2 characters (including omitted) yields an empty
        result rather than an error.
      schema:
        type: string
        maxLength: 255

    EmployeePage:
      name: page
      in: query
      required: false
      description: |
        1-indexed page number. Defaults to 1 (Laravel's standard
        paginate() convention — read automatically from this query
        string parameter, not passed explicitly by the controller).
      schema:
        type: integer
        minimum: 1

    EmployeePerPage:
      name: per_page
      in: query
      required: false
      description: |
        Number of Employees returned per page. Silently clamped to
        [1, 100] by the controller; defaults to 15.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15

    TenantId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UuidV7"

    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MembershipPathIdentifier"

    TargetMembershipId:
      name: target_membership_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MembershipPathIdentifier"

  responses:
    AuthenticationFailed:
      description: Authentication credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationFailedError"

    AuthenticationRequired:
      description: An authenticated identity is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredError"

    AuthenticationContextDenied:
      description: Authenticated Tenant or Membership context is unavailable or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationContextDeniedError"

    AuthorizationDenied:
      description: The authenticated actor is not authorized for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthorizationDeniedError"

    LogoutUnavailable:
      description: Token revocation could not be completed securely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LogoutUnavailableError"

    BrowserSessionAuthenticationRequired:
      description: An authenticated Browser Session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrowserSessionAuthenticationRequiredError"

    InvalidBrowserMembershipId:
      description: Browser Membership locator is malformed or not UUIDv7.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidBrowserMembershipIdError"

    BrowserSessionUnavailable:
      description: Secure Browser Session credential custody could not be resolved or updated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BrowserSessionUnavailableError"

    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    ResourceNotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResourceNotFoundError"

    MembershipSwitchDenied:
      description: Requested Membership is unavailable for the authenticated Person.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipSwitchDeniedError"

    MembershipRoleAssignmentRejected:
      description: Requested Membership or Role is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipRoleAssignmentRejectedError"

    NotificationDispatchFailed:
      description: Notification could not be queued.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotificationDispatchFailedError"

    EmployeeProvisioningFailed:
      description: Employee profile could not be persisted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmployeeProvisioningFailedError"

    InvalidOrganizationalAssignmentId:
      description: Organizational assignment header is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidOrganizationalAssignmentIdError"

    OrganizationalContextRequired:
      description: Organizational assignment context is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationalContextRequiredError"

    OrganizationalContextDenied:
      description: Organizational assignment context is unavailable or not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationalContextDeniedError"

    OrganizationalContextResolutionFailed:
      description: Organizational context resolution failed unexpectedly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrganizationalContextResolutionFailedError"

    InternalServerError:
      description: Operation failed unexpectedly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalServerError"

