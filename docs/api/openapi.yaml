        - id
        - tenant_id
        - employment_id
        - leave_type_id
        - approval_context_placement_id
        - approval_policy_id
        - submitted_by_membership_id
        - status
        - starts_at
        - ends_at
        - request_timezone
        - requested_units
        - unit
        - reason
        - submitted_at
        - final_decided_at
        - withdrawn_at
        - cancelled_at
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/UuidV7"
        tenant_id:
          $ref: "#/components/schemas/UuidV7"
        employment_id:
          $ref: "#/components/schemas/UuidV7"
        leave_type_id:
          $ref: "#/components/schemas/UuidV7"
        approval_context_placement_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        approval_policy_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        submitted_by_membership_id:
          oneOf:
            - $ref: "#/components/schemas/UuidV7"
            - type: "null"
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - IN_REVIEW
            - APPROVED
            - REJECTED
            - WITHDRAWN
            - CANCELLED
        starts_at:
          type: string
        ends_at:
          type: string
        request_timezone:
          type: string
        requested_units:
          description: Decimal string (2 dp).
          type: string
        unit:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        submitted_at:
          type:
            - string
            - "null"
        final_decided_at:
          type:
            - string
            - "null"
        withdrawn_at:
          type:
            - string
            - "null"
        cancelled_at:
