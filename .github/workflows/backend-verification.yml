name: Backend Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Run backend test suite and style check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Beberapa migration HR (mis. compensation_assignments,
    # employee_benefit_participations) memakai fitur khusus PostgreSQL:
    # GiST exclusion constraint (btree_gist), daterange, dan partial
    # unique index. SQLite TIDAK BISA menjalankan migration ini —
    # service container Postgres di sini WAJIB ada, bukan opsional.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: educore_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # DB_* di sini SENGAJA di level job (bukan phpunit.xml) supaya
    # dipakai konsisten baik oleh `php artisan migrate` maupun
    # `php artisan test`. Dotenv (yang membaca file .env) TIDAK akan
    # menimpa environment variable proses yang sudah di-set di sini,
    # jadi nilai job-level ini yang selalu menang.
    #
    # APP_ENV WAJIB eksplisit di sini (bukan hanya di file .env)
    # karena `composer install` sendiri memicu hook
    # `post-autoload-dump` -> `artisan package:discover`, yang
    # mem-boot Laravel SEBELUM file .env sempat dibuat kalau urutan
    # step salah. Tanpa APP_ENV terbaca, Laravel fail-safe ke
    # 'production' secara default, dan
    # AuthServiceProvider::assertProductionBrowserSessionSecurity()
    # (fitur keamanan yang BENAR di Modules/Auth) menolak boot karena
    # config session default belum production-ready. Ini lapis
    # pertama yang tidak bergantung urutan step manapun.
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: educore_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath, ctype, fileinfo, intl, openssl, tokenizer, xml
          coverage: none

      # Lapis kedua (defense-in-depth, bukan duplikasi tanpa arti):
      # .env fisik dibuat SEBELUM composer install, supaya kalau ada
      # script composer lain di masa depan yang juga mem-boot Laravel
      # lewat hook-nya, ia tetap menemukan APP_ENV dari file .env,
      # bukan cuma dari job env di atas.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate application key
        run: php artisan key:generate --ansi

      # Dijalankan terpisah dari `php artisan test` supaya kalau ada
      # migration yang gagal (mis. constraint Postgres salah tulis),
      # error-nya jelas muncul di step ini, bukan tenggelam di tengah
      # ratusan hasil test.
      - name: Run database migrations
        run: php artisan migrate --force

      - name: Check code style (Laravel Pint)
        run: vendor/bin/pint --test

      # 15 test gagal dengan "Vite manifest not found" sebelum step
      # ini ditambahkan — beberapa test Feature (mis.
      # PlatformTenantSubscriptionControllerTest) me-render Blade
      # view lama (resources/views/platform/...) yang memakai
      # direktif @vite() Laravel. Direktif itu butuh
      # public/build/manifest.json ada secara FISIK di disk, terlepas
      # dari environment testing — tidak ada mock/stub bawaan Laravel
      # untuk ini. `npm run build` (root vite.config.js, BUKAN
      # frontend/vite.config.ts) yang menghasilkannya.
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite assets for Blade views
        run: npm run build

      - name: Run test suite
        run: php artisan test
